name: Build

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Gitflow pull request target
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*) ;;
            *)
              echo "::error::Pull requests into master must come from release/* or hotfix/* branches. Target develop for feature and other contributor work."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
